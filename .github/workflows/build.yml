name: Build MelmanAPP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf /tmp/melman_project
          mkdir -p /tmp/melman_project
          unzip -q "app/MelmanAPP_GitHub_Project.zip" -d /tmp/melman_project

          PROJECT_ROOT="$(find /tmp/melman_project -maxdepth 4 -type f -name settings.gradle -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "settings.gradle not found in archive"
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MelmanAPP-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
